name: Importar fotos públicas verificadas
on:
  push:
    branches: [chore/instagram-media-access-test]
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install -q Pillow
      - name: Baixar imagens verificando conteúdo e formato
        shell: bash
        run: |
          python - <<'PY'
          import io,json,urllib.request
          from pathlib import Path
          from PIL import Image,ImageOps
          posts=json.loads(r'''[{"src":"https://s2.imginn.com/858994531_18380643646233426_1903077507743111519_n.webp?t51.82787-15/858994531_18380643646233426_1903077507743111519_n.webp?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=105&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiRkVFRC5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=TdxxgFB66hQQ7kNvwGwJEQt&_nc_oc=AdrL0FDZx-WXcJMyXVRgWN-9LY1OClvqTlc7Aeoyn9nntiFmA8TYyT_36_MCewy29dns---DD1IF51rX76NxrEbL&_nc_zt=23&_nc_ht=scontent-atl3-2.cdninstagram.com&_nc_gid=fn7x93ZaqriPnl-Nom7_cw&_nc_ss=70689&oh=00_AQOCwlVAstz3W3lPOSotohbyag8Lf5pEQCFJujapIoi_Iw&oe=6AE00C90","code":"DevA8svNElE","post":"https://www.instagram.com/p/DevA8svNElE/","title":"Turma baby: brincar e aprender"},{"src":"https://s2.imginn.com/626278022_1953908385521075_2491066876884984971_n.jpg?t51.71878-15/626278022_1953908385521075_2491066876884984971_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=104&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0xJUFMuYmVzdF9pbWFnZV91cmxnZW4uQzMifQ%3D%3D&_nc_ohc=nNWX6xEVON8Q7kNvwH-aqUs&_nc_oc=AdqTX1tfrZuAdJz46AhCe-pyJsVqobX_s_2R419aLErw4yxqwmb4qMvQgN2uowMZmQcTSbGSUPbGKuU2wzovDcMv&_nc_zt=23&_nc_ht=scontent-atl3-2.cdninstagram.com&_nc_gid=fn7x93ZaqriPnl-Nom7_cw&_nc_ss=70689&oh=00_AQN0ZyiYCMOqjULjh-GroJnGPJcBgYAmY1F7R1_6bM3a8w&oe=6AE0286F","code":"DUotMErjcsh","post":"https://www.instagram.com/p/DUotMErjcsh/","title":"Aprendizagem e acolhimento"},{"src":"https://s2.imginn.com/813546049_18375108271233426_343712826981373026_n.webp?t51.82787-15/813546049_18375108271233426_343712826981373026_n.webp?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=102&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiRkVFRC5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=g15gLZrEAcAQ7kNvwE5VGsH&_nc_oc=AdouRbGPirXjvITiE8O04ZG32yFzVl0_H2ZR8V0dS-M6-TRKmoxEksgNIH2YR2jcb2aB8l9iD3rRlQLzpwUSYsc6&_nc_zt=23&_nc_ht=scontent-atl3-2.cdninstagram.com&_nc_gid=fn7x93ZaqriPnl-Nom7_cw&_nc_ss=70689&oh=00_AQNS8eo2UT5byP3MH9sXTrv2Mn8zsran80goBQb9YcSDyA&oe=6AE018A4","code":"DdXeyhWtCxt","post":"https://www.instagram.com/p/D