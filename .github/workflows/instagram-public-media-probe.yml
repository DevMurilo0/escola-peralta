mRH5","post":"https://www.instagram.com/p/DYQa2rtmRH5/","title":"Registros da Terça da Nutri"},{"src":"https://s2.imginn.com/696237518_18355592902233426_2675150649484587220_n.webp?t51.82787-15/696237518_18355592902233426_2675150649484587220_n.webp?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=108&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=3Auw6SGUUskQ7kNvwEHR2xU&_nc_oc=Adobq-7SLr0-2bofoLPPG9ZdCWMaQd45qG-hRsPVkNLjToGrtvVwzTnQLfTzhz101D3uzGDKHUrJs4ubKkRrWQsY&_nc_zt=23&_nc_ht=scontent-atl3-1.cdninstagram.com&_nc_gid=fn7x93ZaqriPnl-Nom7_cw&_nc_ss=70689&oh=00_AQMGBwQ-PEE-va8xx1OpF1OO_1z9E-5lz6ctS3RyqCjLyg&oe=6AE037E0","code":"DYP6_n1mS2I","post":"https://www.instagram.com/p/DYP6_n1mS2I/","title":"Terça da Nutri na prática"},{"src":"https://s2.imginn.com/687669213_18354542290233426_1557585529670540705_n.webp?t51.82787-15/687669213_18354542290233426_1557585529670540705_n.webp?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=101&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=SzDs3nL0f28Q7kNvwEy014G&_nc_oc=AdoxKEdrDuB-9wIhBssrCNOmV7zkeOf9uBCabeIAXpNGNGuKJgni7sIWrtchYNF0Hu_rpPXwbVsmMMYitKCkMuBS&_nc_zt=23&_nc_ht=scontent-atl3-2.cdninstagram.com&_nc_gid=fn7x93ZaqriPnl-Nom7_cw&_nc_ss=70689&oh=00_AQNyHJKod2sy7Ie6CZR06mt_spef70fTziuF_x7ZNhxSoA&oe=6AE03D84","code":"DX9Cw8wjjDE","post":"https://www.instagram.com/p/DX9Cw8wjjDE/","title":"Lancheira saudável"}]''')
          dst=Path('public/images/school/instagram')
          dst.mkdir(parents=True,exist_ok=True)
          index=[]
          for row in posts:
              code=row['code']
              try:
                  request=urllib.request.Request(row['src'],headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      raw=response.read()
                  image=Image.open(io.BytesIO(raw))
                  image.load()
                  image=ImageOps.exif_transpose(image).convert('RGB')
                  if min(image.size)<220: raise ValueError(f'resolução insuficiente: {image.size}')
                  w,h=image.size
                  image.thumbnail((1440,1440),Image.Resampling.LANCZOS)
                  filename=code+'.webp'
                  image.save(dst/filename,format='WEBP',quality=88,method=6)
                  index.append({'file':'/images/school/instagram/'+filename,'post':row['post'],'title':row['title'],'author':'@escolaperaltagravata','width':w,'height':h,'downloadedAt':'2026-10-22','status':'candidato para curadoria; conferir uso de imagem de menores'})
                  print('OK',code,w,h,len(raw))
              except Exception as exc:
                  print('ERRO',code,repr(exc))
          Path('docs/design').mkdir(parents=True,exist_ok=True)
          Path('docs/design/instagram-candidatas-2026.json').write_text(json.dumps(index,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('TOTAL',len(index))
          PY
      - name: Salvar apenas arquivos verificados na branch de testes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/school/instagram docs/design/instagram-candidatas-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: importa imagens verificadas do Instagram oficial para curadoria"
            git push origin HEAD:chore/instagram-media-access-test
          fi
