name: Diagnóstico de acesso a fotos públicas
on:
  push:
    branches: [chore/instagram-media-access-test]
jobs:
  check-public-images:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Testar acesso anônimo aos arquivos públicos
        shell: bash
        run: |
          set +e
          urls=(
            'https://lookaside.instagram.com/seo/google_widget/crawler/?media_id=3915735742059057909'
            'https://s2.imginn.com/858994531_18380643646233426_1903077507743111519_n.webp'
            'https://imginn.com/p/DevA8svNElE/'
            'https://www.instagram.com/p/DdXeyhWtCxt/'
          )
          for i in "${!urls[@]}"; do
            echo "Testing source $i"
            curl --compressed -L -sS --max-time 18 --connect-timeout 10 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36' \
              -o "/tmp/test_$i" -w 'HTTP=%{http_code} MIME=%{content_type} SIZE=%{size_download}\n' "${urls[$i]}"
            file "/tmp/test_$i"
          done
