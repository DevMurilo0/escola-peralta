name: Gerar imagem de compartilhamento
on:
  push:
    branches: [feat/compartilhamento-social-peralta]
    paths:
      - 'scripts/generate-social-card.py'
      - '.github/workflows/gerar-imagem-compartilhamento.yml'
permissions:
  contents: write
jobs:
  generate-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Gerar banner OG 1200x630
        run: python scripts/generate-social-card.py
      - name: Salvar JPEG na branch de implementação
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/social/escola-peralta-compartilhar.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'assets: gera imagem Open Graph para compartilhar Escola Peralta'
            git push origin HEAD:feat/compartilhamento-social-peralta
          fi
